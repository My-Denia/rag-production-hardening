[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bench"
version = "0.2.1"
description = "Evaluable RAG QA + LangGraph stateful orchestration with external-judge metrics and ablations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rag-bench" }]
dependencies = [
  "langchain>=0.3.0,<1.0",
  "langchain-core>=0.3.0,<1.0",
  "langchain-community>=0.3.0,<1.0",
  "langchain-text-splitters>=0.3.0,<1.0",
  "langgraph>=0.2.0,<1.0",
  "langgraph-checkpoint-sqlite>=2.0.0,<3.0",
  "faiss-cpu>=1.8.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
semantic = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
rag-bench = "rag_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
