name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install package (dev + semantic)
        run: pip install -e ".[dev,semantic]"

      - name: Pytest
        run: pytest -q

      - name: Freeze / regression fixture verify
        run: python -c "from rag_bench.freeze_regression import verify; r=verify(); print(r); raise SystemExit(0 if r.get('ok') else 1)"

      - name: Security path/secret scan
        run: python scripts/sanitize_public_tree.py --scan-only

